<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App Details - DTAhub</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.0/dist/cdn.min.js"></script>
<style>
  body { background: #0F172A; color: #F1F5F9; }
</style>
</head>
<body x-data="appDetail()" x-init="load()">

<nav class="sticky top-0 z-50 backdrop-blur-lg bg-slate-900/80 border-b border-purple-500/20">
  <div class="max-w-4xl mx-auto flex items-center justify-between px-4 py-4">
    <a href="/" class="flex items-center gap-2 text-sm font-semibold hover:text-purple-400">← Back to apps</a>
    <div class="text-sm text-slate-400">DTAhub</div>
  </div>
</nav>

<main class="max-w-4xl mx-auto px-4 py-8" x-show="!loading">

  <div x-show="error" class="text-center py-20">
    <div class="text-5xl mb-4">😕</div>
    <p class="text-lg font-bold" x-text="error"></p>
    <a href="/" class="inline-block mt-4 px-6 py-3 rounded-xl bg-purple-600 text-white font-bold">Back Home</a>
  </div>

  <template x-if="app">
    <div>
      <div class="flex items-start gap-5 mb-8">
        <div class="w-24 h-24 rounded-2xl bg-gradient-to-br from-purple-600 to-indigo-600 flex items-center justify-center text-5xl overflow-hidden flex-shrink-0">
          <template x-if="app.iconUrl">
            <img :src="app.iconUrl" class="w-full h-full object-cover">
          </template>
          <template x-if="!app.iconUrl">
            <span>📱</span>
          </template>
        </div>
        <div class="flex-1">
          <h1 class="text-2xl md:text-3xl font-bold mb-1" x-text="app.name"></h1>
          <p class="text-slate-400 text-sm mb-2" x-text="app.shortDesc"></p>
          <div class="flex gap-3 text-xs text-slate-400">
            <span class="px-2 py-1 rounded-lg bg-purple-500/15 text-purple-300 font-semibold" x-text="app.category"></span>
            <span x-text="'v' + app.version"></span>
            <span x-text="app.sizeMb + ' MB'"></span>
          </div>
        </div>
      </div>

      <a :href="app.apkUrl" @click.prevent="download()" 
        class="block w-full py-4 rounded-2xl bg-gradient-to-r from-purple-600 to-indigo-600 text-white text-center font-bold text-lg shadow-lg shadow-purple-500/30 hover:shadow-purple-500/50 transition mb-8">
        ⬇ Download APK (<span x-text="app.sizeMb"></span> MB)
      </a>

      <div class="grid grid-cols-3 gap-3 mb-8">
        <div class="p-3 rounded-xl bg-slate-800/50 border border-slate-700 text-center">
          <div class="text-2xl font-bold text-purple-400" x-text="formatNum(app.downloads)"></div>
          <div class="text-xs text-slate-400">Downloads</div>
        </div>
        <div class="p-3 rounded-xl bg-slate-800/50 border border-slate-700 text-center">
          <div class="text-2xl font-bold text-green-400" x-text="app.version"></div>
          <div class="text-xs text-slate-400">Version</div>
        </div>
        <div class="p-3 rounded-xl bg-slate-800/50 border border-slate-700 text-center">
          <div class="text-2xl font-bold text-blue-400" x-text="app.sizeMb + ' MB'"></div>
          <div class="text-xs text-slate-400">Size</div>
        </div>
      </div>

      <div class="mb-8">
        <h2 class="text-lg font-bold mb-3">About this app</h2>
        <p class="text-slate-300 text-sm leading-relaxed whitespace-pre-line" x-text="app.longDesc"></p>
      </div>
    </div>
  </template>
</main>

<div x-show="loading" class="fixed inset-0 flex items-center justify-center">
  <div class="w-12 h-12 rounded-full border-4 border-purple-500/30 border-t-purple-500 animate-spin"></div>
</div>

<script>
function appDetail() {
  return {
    app: null,
    loading: true,
    error: '',

    async load() {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get('slug');
      if (!slug) { this.error = 'App not found'; this.loading = false; return; }

      try {
        const res = await fetch('/api/apps/slug/' + slug);
        if (!res.ok) throw new Error('App not found');
        const data = await res.json();
        this.app = data.app;
        document.title = this.app.name + ' - DTAhub';
      } catch (e) {
        this.error = e.message;
      } finally {
        this.loading = false;
      }
    },

    async download() {
      try {
        const res = await fetch('/api/apps/' + this.app.slug + '/download', { method: 'POST' });
        const data = await res.json();
        if (data.apkUrl) {
          window.location.href = data.apkUrl;
          this.app.downloads++;
        }
      } catch (e) {
        window.location.href = this.app.apkUrl;
      }
    },

    formatNum(n) {
      if (!n) return '0';
      if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
      if (n >= 1000) return (n/1000).toFixed(1) + 'K';
      return n.toString();
    }
  }
}
</script>
</body>
</html>
