<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login - DTAhub</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.0/dist/cdn.min.js"></script>
<style>
  body { background: #0F172A; color: #F1F5F9; }
</style>
</head>
<body x-data="loginApp()">

<div class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-gradient-to-br from-purple-600 to-indigo-600 flex items-center justify-center text-white font-bold text-2xl">D</div>
      <h1 class="text-2xl font-bold">DTAhub Admin</h1>
      <p class="text-slate-400 text-sm mt-1">Login to manage apps</p>
    </div>

    <div class="p-6 rounded-2xl bg-slate-800/50 border border-purple-500/20">
      <form @submit.prevent="submit()" class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-2">Email</label>
          <input type="email" x-model="email" required
            class="w-full px-4 py-3 rounded-xl bg-slate-900/50 border border-slate-700 focus:border-purple-500 focus:outline-none"
            placeholder="admin@example.com">
        </div>

        <div>
          <label class="block text-sm font-medium mb-2">Password</label>
          <input type="password" x-model="password" required
            class="w-full px-4 py-3 rounded-xl bg-slate-900/50 border border-slate-700 focus:border-purple-500 focus:outline-none"
            placeholder="••••••••">
        </div>

        <template x-if="error">
          <div class="p-3 rounded-lg bg-red-500/10 border border-red-500/30 text-red-400 text-sm" x-text="error"></div>
        </template>

        <button type="submit" :disabled="loading"
          class="w-full py-3 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold hover:shadow-lg hover:shadow-purple-500/30 transition disabled:opacity-50">
          <span x-show="!loading">Login</span>
          <span x-show="loading">Logging in...</span>
        </button>
      </form>
    </div>

    <div class="text-center mt-6">
      <a href="/" class="text-sm text-slate-400 hover:text-purple-400">← Back to site</a>
    </div>
  </div>
</div>

<script>
function loginApp() {
  return {
    email: '',
    password: '',
    loading: false,
    error: '',

    async submit() {
      this.loading = true;
      this.error = '';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: this.email, password: this.password })
        });
        const data = await res.json();

        if (!res.ok) {
          this.error = data.error || 'Login failed';
          this.loading = false;
          return;
        }

        if (data.user.role !== 'ADMIN') {
          this.error = 'Admin access required';
          this.loading = false;
          return;
        }

        localStorage.setItem('dtahub_token', data.token);
        localStorage.setItem('dtahub_user', JSON.stringify(data.user));
        window.location.href = '/admin/dashboard.html';
      } catch (e) {
        this.error = 'Network error: ' + e.message;
        this.loading = false;
      }
    }
  }
}
</script>
</body>
</html>
