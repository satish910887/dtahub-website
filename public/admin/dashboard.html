<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard - DTAhub Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.0/dist/cdn.min.js"></script>
<style>
  body { background: #0F172A; color: #F1F5F9; }
</style>
</head>
<body x-data="dashApp()" x-init="init()">

<nav class="border-b border-purple-500/20 bg-slate-900/50 backdrop-blur">
  <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-purple-600 to-indigo-600 flex items-center justify-center text-white font-bold">D</div>
      <div>
        <div class="font-bold">DTAhub Admin</div>
        <div class="text-xs text-slate-400" x-text="user?.email || ''"></div>
      </div>
    </div>
    <div class="flex gap-2">
      <a href="/admin/upload.html" class="px-4 py-2 rounded-lg bg-purple-600 text-white text-sm font-semibold hover:bg-purple-700">+ Upload</a>
      <button @click="logout()" class="px-4 py-2 rounded-lg border border-slate-700 text-sm hover:bg-slate-800">Logout</button>
    </div>
  </div>
</nav>

<main class="max-w-6xl mx-auto px-4 py-8">
  <h1 class="text-2xl font-bold mb-6">Dashboard</h1>

  <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
    <div class="p-4 rounded-xl bg-slate-800/50 border border-slate-700">
      <div class="text-3xl font-bold text-purple-400" x-text="apps.length"></div>
      <div class="text-sm text-slate-400">Total Apps</div>
    </div>
    <div class="p-4 rounded-xl bg-slate-800/50 border border-slate-700">
      <div class="text-3xl font-bold text-green-400" x-text="totalDownloads"></div>
      <div class="text-sm text-slate-400">Downloads</div>
    </div>
    <div class="p-4 rounded-xl bg-slate-800/50 border border-slate-700">
      <div class="text-3xl font-bold text-blue-400" x-text="apps.filter(a => a.isPublished).length"></div>
      <div class="text-sm text-slate-400">Published</div>
    </div>
    <div class="p-4 rounded-xl bg-slate-800/50 border border-slate-700">
      <div class="text-3xl font-bold text-orange-400" x-text="categories.length"></div>
      <div class="text-sm text-slate-400">Categories</div>
    </div>
  </div>

  <h2 class="text-lg font-bold mb-4">Your Apps</h2>

  <template x-if="loading">
    <div class="text-center py-10 text-slate-400">Loading...</div>
  </template>

  <template x-if="!loading && apps.length === 0">
    <div class="text-center py-16 rounded-2xl bg-slate-800/30 border border-slate-700">
      <div class="text-5xl mb-3">📦</div>
      <div class="text-lg font-semibold">No apps yet</div>
      <div class="text-sm text-slate-400 mt-1 mb-4">Upload your first APK to get started</div>
      <a href="/admin/upload.html" class="inline-block px-6 py-3 rounded-xl bg-purple-600 text-white font-bold hover:bg-purple-700">Upload App</a>
    </div>
  </template>

  <div class="space-y-3">
    <template x-for="app in apps" :key="app.id">
      <div class="p-4 rounded-xl bg-slate-800/50 border border-slate-700 flex items-center gap-4">
        <div class="w-12 h-12 rounded-xl bg-purple-600/20 flex items-center justify-center text-2xl">
          <span x-text="app.iconUrl ? '' : '📱'"></span>
          <img x-show="app.iconUrl" :src="app.iconUrl" class="w-full h-full rounded-xl object-cover">
        </div>
        <div class="flex-1">
          <div class="font-bold" x-text="app.name"></div>
          <div class="text-xs text-slate-400">
            <span x-text="'v' + app.version"></span> ·
            <span x-text="app.category"></span> ·
            <span x-text="app.sizeMb + ' MB'"></span> ·
            <span x-text="app.downloads + ' downloads'"></span>
          </div>
        </div>
        <button @click="deleteApp(app.id)" class="px-3 py-1.5 rounded-lg bg-red-500/10 border border-red-500/30 text-red-400 text-sm hover:bg-red-500/20">Delete</button>
      </div>
    </template>
  </div>
</main>

<script>
function dashApp() {
  return {
    apps: [],
    categories: [],
    user: null,
    loading: true,

    get totalDownloads() {
      return this.apps.reduce((sum, a) => sum + (a.downloads || 0), 0);
    },

    init() {
      const token = localStorage.getItem('dtahub_token');
      const userStr = localStorage.getItem('dtahub_user');
      if (!token || !userStr) {
        window.location.href = '/admin/login.html';
        return;
      }
      this.user = JSON.parse(userStr);
      if (this.user.role !== 'ADMIN') {
        window.location.href = '/admin/login.html';
        return;
      }
      this.load();
    },

    async load() {
      try {
        const res = await fetch('/api/apps');
        const data = await res.json();
        this.apps = data.apps || [];

        const catRes = await fetch('/api/apps/categories');
        const catData = await catRes.json();
        this.categories = catData.categories || [];
      } catch (e) {
        console.error(e);
      } finally {
        this.loading = false;
      }
    },

    async deleteApp(id) {
      if (!confirm('Delete this app?')) return;
      const token = localStorage.getItem('dtahub_token');
      const res = await fetch('/api/apps/' + id, {
        method: 'DELETE',
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if (res.ok) this.load();
      else alert('Delete failed');
    },

    logout() {
      localStorage.removeItem('dtahub_token');
      localStorage.removeItem('dtahub_user');
      window.location.href = '/admin/login.html';
    }
  }
}
</script>
</body>
</html>
